<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autos Odiados</title>
    <script src="https://unpkg.com/jspdf@latest/dist/jspdf.umd.min.js"></script>

    <link rel="stylesheet" href="css/styles.css">
    <link rel="shortcut icon" href="img/Logo.png" type="image/x-icon">

    <script defer src="js/main.js"></script>
    <script defer src="js/carrito.js"></script>
    <script defer src="js/theme.js"></script>
</head>

<body>

    <header>
        <div class="logo-container">
            <img src="img/Logo.png" class="logo-img" alt="logo auto">
        </div>
        <nav class="navbar">
            <div class="logo">
                <a href="productos.html" class="mynerve-regular">Autoservicio Veloz</a>
            </div>

            <div class="nav-actions">
                <div class="nav-links">
                    <a href="productos.html">Inicio</a>
                    <a href="carrito.html">🛒</a>
                </div>
                <div class="navbar-user">Francisco</div>
                <button id="theme-toggle"
                    style="background: none; border: none; font-size: 20px; cursor: pointer; color:white;">🌙</button>
                <input type="text" placeholder="Buscar..." class="search-bar">
            </div>
        </nav>

    </header>

    <main>
        <section class="products-section">
            <div id="products-welcome">
                <h2 id="saludo-usuario"></h2>
                <h2>Nada mejor que un vehiculo usado</h2>
            </div>

            <div id="category-filters" class="category-filters"></div>

            <div class="product-grid"></div>
            <div id="pagination-container" class="pagination-container"></div>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 Autoservicio Veloz. Todos los derechos reservados.</p>
    </footer>
</body>

</html>
