<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autos Odiados</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="shortcut icon" href="img/Logo.png" type="image/x-icon">
    <script defer src="js/bienvenida.js"></script>
    <script defer src="js/theme.js"></script>
</head>

<body class="pagina-bienvenida">
    <header class="header-bienvenida">
        <img src="img/Logo.png" class="logo-img" alt="logo auto">
        <h2>Autoservicio Veloz</h2>
        <button id="theme-toggle" style="background: none; border: none; font-size: 20px; cursor: pointer;">🌙</button>
    </header>

    <main class="main-bienvenida">

        <h1>Bienvenido a Autoservicio Veloz
        </h1>

        <h4>Introducí tu nombre</h4>
        <form id="form-bienvenida">
            <input type="text" id="bienvenida-nombre">
            <input class="btn-enviar" type="submit" value="Ingresar">
        </form>
        <div>
            <button id="admin-boton"> Administrador</button>
        </div>
    </main>
    <footer>
        <p>&copy; 2026 Autoservicio Veloz. Todos los derechos reservados.</p>
        <p>Alumno: Francisco </p>
    </footer>
</body>

</html>
